name: Deploy Streamlit

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MAHASISWA_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 103.150.226.34 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to Server
        run: |
          ssh mahasiswa@103.150.226.34 << 'ENDSSH'
            cd ./noah_austin/Bvrie
            pip install -r requirements.txt
            pkill -f "streamlit run" || true
            sleep 1
            nohup streamlit run app1.py --server.port 8767 > streamlit.log 2>&1 < /dev/null &
            sleep 2
            echo "Streamlit started"
          ENDSSH